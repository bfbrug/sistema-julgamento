name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: judging_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generate Prisma client
        run: pnpm --filter @judging/api prisma:generate

      - name: Type check
        run: pnpm type-check --force

      - name: Test
        run: pnpm test:ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/judging_test
          NODE_ENV: test
          PORT: 3001
          LOG_LEVEL: error
          CORS_ORIGIN: http://localhost:3001
          JWT_ACCESS_SECRET: ci-test-access-secret-must-be-at-least-32-chars
          JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-at-least-32-chars
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          BCRYPT_ROUNDS: 10
          REDIS_URL: redis://localhost:6379
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          STORAGE_DRIVER: local
          STORAGE_LOCAL_ROOT: /tmp/uploads-test
          PARTICIPANT_PHOTO_MAX_BYTES: 2097152
          PARTICIPANT_PHOTO_ALLOWED_MIMES: image/jpeg,image/png
          THROTTLE_AUTH_TTL: 60
          THROTTLE_AUTH_LIMIT: 100

      - name: Build
        run: pnpm build
